# Delivers the Akuity API key into every control plane without it ever appearing
# in a package value or a RuntimeConfig.
#
# Applied in the Space (group namespace), not inside the control plane. The
# patched chart reads the credentials from this Secret via `existingSecret`
# instead of rendering one from plaintext values.
#
# Ordering note: Helm creates the release namespace (`akuity`) at install time
# with CreateNamespace, so the Secret may not be projected there yet when the
# pre-install Job is created. That is fine — the Job's pod stays in
# CreateContainerConfigError and kubelet retries until the Secret appears, well
# within the 10-minute Helm wait. If you would rather avoid the race entirely,
# set releaseNamespace to a namespace the SharedExternalSecret already populates.
apiVersion: spaces.upbound.io/v1alpha1
kind: SharedExternalSecret
metadata:
  name: akuity-agent-credentials
  namespace: default
spec:
  controlPlaneSelector:
    labelSelectors:
      - matchLabels:
          akuity.io/register: "true"
  namespaceSelector:
    names:
      - akuity
  externalSecretSpec:
    refreshInterval: 1h
    target:
      # Must match `existingSecret.name` in the package values.
      name: akuity-agent-credentials
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    data:
      - secretKey: AKUITY_API_KEY_ID
        remoteRef:
          key: /platform/akuity
          property: api_key_id
      - secretKey: AKUITY_API_KEY_SECRET
        remoteRef:
          key: /platform/akuity
          property: api_key_secret
